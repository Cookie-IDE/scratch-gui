name: Build, Deploy & Release

on:
  workflow_dispatch:
    inputs:
      semver:
        description: "Semver (leave blank if not making release, example '1.0.0')"
        type: string
        required: false
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Build site
        run: NODE_ENV="production" ./node_modules/.bin/webpack --bail
        
      - name: Upload artifact 
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/

      
      - name: Make zip for release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.semver != ''
        run: |
          cd ./build/
          zip -r ../penguinmod-v${{ inputs.semver }}.zip .

      - name: Create release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.semver != ''
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: "v${{ inputs.semver }}"
          name: "v${{ inputs.semver }}"
          commit: main
          artifacts: "penguinmod-v${{ inputs.semver }}.zip"

  deploy:
    
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
